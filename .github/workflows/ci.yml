name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests --ignore=tests/test_integration.py
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install bandit pip-audit
      - name: Static analysis (bandit)
        run: bandit -q -r ftuni -ll        # report medium+ severity
      - name: Dependency CVE audit (pip-audit)
        run: pip-audit -r requirements-runtime.txt || true   # advisory, non-blocking in coursework
