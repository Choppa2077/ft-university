# Generated by deploy/make_compose.py from ftuni/config.py - do not edit by hand.
#   FTUNI_MODE=endterm COMPOSE_PROFILES=replicas docker compose up -d     (endterm build)
#   FTUNI_MODE=ft      COMPOSE_PROFILES=replicas docker compose up -d     (midterm FT build)
#   FTUNI_MODE=baseline                          docker compose up -d     (midterm baseline)
name: ftuni

x-app: &app
  image: ftuni:endterm
  build: .
  init: true
  restart: always
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes: ["run:/app/run"]       # named volume (ext4 in the Docker VM), not a host bind mount
  depends_on:
    init: {condition: service_completed_successfully}
  healthcheck:
    test: ["CMD", "/app/deploy/healthcheck.sh"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 20s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "2"}

services:
  init:
    image: ftuni:endterm
    entrypoint: ["python", "-m", "ftuni.dockerinit"]
    restart: "no"
    network_mode: none
    read_only: true
    user: "0:0"                     # only to hand the fresh volume to the app user (uid 10001)
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
    volumes: ["run:/app/run"]

  gateway:
    <<: *app
    container_name: ftuni-gateway
    hostname: gateway
    command: ["gateway"]
    ports: ["127.0.0.1:8000:8000"]
    cpus: 1.0
    mem_limit: 384m
    labels: {ftuni.kind: "gateway", ftuni.node: "ctl"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8000"
    networks:
      - app
    secrets:
      - {source: jwt_key, target: jwt_key}
      - {source: ops_token, target: ops_token}
      - {source: users, target: users.json}

  monitor:
    <<: *app
    container_name: ftuni-monitor
    hostname: monitor
    command: ["monitor"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "monitor", ftuni.node: "ctl"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8001"
    networks:
      - app
      - data
      - bank
    secrets:
      - {source: db_token_monitor, target: db_token}
      - {source: ops_token, target: ops_token}

  bank:
    <<: *app
    container_name: ftuni-bank
    hostname: bank
    command: ["bank"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "bank", ftuni.node: "ext"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8002"
    networks:
      - bank
    secrets:
      - {source: ops_token, target: ops_token}

  db-a:
    <<: *app
    container_name: ftuni-db-a
    hostname: db-a
    command: ["db-a"]
    cpus: 1.0
    mem_limit: 512m
    labels: {ftuni.kind: "db", ftuni.node: "A"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8110"
    networks:
      - data
    secrets:
      - {source: db_token_peer, target: db_token}
      - {source: db_token_student, target: db_token_student}
      - {source: db_token_payment, target: db_token_payment}
      - {source: db_token_records, target: db_token_records}
      - {source: db_token_monitor, target: db_token_monitor}
      - {source: ops_token, target: ops_token}

  student-a:
    <<: *app
    container_name: ftuni-student-a
    hostname: student-a
    command: ["student-a"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "student", ftuni.node: "A"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8120"
    networks:
      - app
      - data
    secrets:
      - {source: db_token_student, target: db_token}
      - {source: ops_token, target: ops_token}

  payment-a:
    <<: *app
    container_name: ftuni-payment-a
    hostname: payment-a
    command: ["payment-a"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "payment", ftuni.node: "A"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8130"
    networks:
      - app
      - data
      - bank
    secrets:
      - {source: db_token_payment, target: db_token}
      - {source: ops_token, target: ops_token}

  records-a:
    <<: *app
    container_name: ftuni-records-a
    hostname: records-a
    command: ["records-a"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "records", ftuni.node: "A"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8140"
    networks:
      - app
      - data
    secrets:
      - {source: db_token_records, target: db_token}
      - {source: ops_token, target: ops_token}

  timetable-a:
    <<: *app
    container_name: ftuni-timetable-a
    hostname: timetable-a
    command: ["timetable-a"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "timetable", ftuni.node: "A"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8150"
    networks:
      - app
    secrets:
      - {source: ops_token, target: ops_token}

  db-b:
    <<: *app
    container_name: ftuni-db-b
    hostname: db-b
    command: ["db-b"]
    profiles: ["replicas"]
    cpus: 1.0
    mem_limit: 512m
    labels: {ftuni.kind: "db", ftuni.node: "B"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8210"
    networks:
      - data
    secrets:
      - {source: db_token_peer, target: db_token}
      - {source: db_token_student, target: db_token_student}
      - {source: db_token_payment, target: db_token_payment}
      - {source: db_token_records, target: db_token_records}
      - {source: db_token_monitor, target: db_token_monitor}
      - {source: ops_token, target: ops_token}

  student-b:
    <<: *app
    container_name: ftuni-student-b
    hostname: student-b
    command: ["student-b"]
    profiles: ["replicas"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "student", ftuni.node: "B"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8220"
    networks:
      - app
      - data
    secrets:
      - {source: db_token_student, target: db_token}
      - {source: ops_token, target: ops_token}

  payment-b:
    <<: *app
    container_name: ftuni-payment-b
    hostname: payment-b
    command: ["payment-b"]
    profiles: ["replicas"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "payment", ftuni.node: "B"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8230"
    networks:
      - app
      - data
      - bank
    secrets:
      - {source: db_token_payment, target: db_token}
      - {source: ops_token, target: ops_token}

  records-b:
    <<: *app
    container_name: ftuni-records-b
    hostname: records-b
    command: ["records-b"]
    profiles: ["replicas"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "records", ftuni.node: "B"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8240"
    networks:
      - app
      - data
    secrets:
      - {source: db_token_records, target: db_token}
      - {source: ops_token, target: ops_token}

  timetable-b:
    <<: *app
    container_name: ftuni-timetable-b
    hostname: timetable-b
    command: ["timetable-b"]
    profiles: ["replicas"]
    cpus: 0.5
    mem_limit: 256m
    labels: {ftuni.kind: "timetable", ftuni.node: "B"}
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
      FTUNI_PORT: "8250"
    networks:
      - app
    secrets:
      - {source: ops_token, target: ops_token}

  alert-sink:
    <<: *app
    container_name: ftuni-alert-sink
    entrypoint: ["python", "-m", "ftuni.alertsink"]
    command: []
    healthcheck: {disable: true}
    cpus: 0.25
    mem_limit: 128m
    environment:
      FTUNI_DOCKER: "1"
      FTUNI_MODE: "${FTUNI_MODE:-endterm}"
      FTUNI_RUN_DIR: /app/run
    networks: [ops]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ftuni-prometheus
    restart: always
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h",
              "--web.enable-lifecycle"]
    depends_on:
      init: {condition: service_completed_successfully}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - run:/ftuni-run:ro           # scrape targets written by the init container
    secrets: [{source: ops_token, target: ops_token}]
    ports: ["127.0.0.1:9090:9090"]
    cpus: 1.0
    mem_limit: 512m
    networks: [app, data, bank, ops]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ftuni-alertmanager
    restart: always
    volumes: ["./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]
    cpus: 0.25
    mem_limit: 128m
    networks: [ops]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ftuni-grafana
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ftuni.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [{source: grafana_admin, target: grafana_admin}]
    ports: ["127.0.0.1:3000:3000"]
    cpus: 0.5
    mem_limit: 256m
    networks: [ops]

volumes:
  run: {}

networks:
  app: {}
  data: {internal: true}
  bank: {internal: true}
  ops: {}

secrets:
  jwt_key: {file: ./deploy/secrets/jwt_key}
  ops_token: {file: ./deploy/secrets/ops_token}
  users: {file: ./deploy/secrets/users.json}
  db_token_peer: {file: ./deploy/secrets/db_token_peer}
  db_token_student: {file: ./deploy/secrets/db_token_student}
  db_token_payment: {file: ./deploy/secrets/db_token_payment}
  db_token_records: {file: ./deploy/secrets/db_token_records}
  db_token_monitor: {file: ./deploy/secrets/db_token_monitor}
  grafana_admin: {file: ./deploy/secrets/grafana_admin}
